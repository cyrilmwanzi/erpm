name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: "Publish @scace/sdk to npm"
        type: boolean
        default: true
      auth_mode:
        description: "npm publish authentication mode"
        type: choice
        options:
          - oidc
          - auto
          - token
        default: oidc
      force_sdk_publish:
        description: "Run release/publish even without pending or consumed changeset files"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  check-changesets:
    name: Check Changeset Files
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
      consumed_changesets: ${{ steps.detect.outputs.consumed_changesets }}
      should_release: ${{ steps.detect.outputs.should_release }}
      changeset_files: ${{ steps.detect.outputs.changeset_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect pending or consumed changeset files
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_sdk_publish }}" = "true" ]; then
            node scripts/release.mjs check --github-commit --force
          else
            node scripts/release.mjs check --github-commit
          fi

  release:
    name: Version, Tag & Release
    needs: check-changesets
    if: needs.check-changesets.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://scace:scace_ci_password@localhost:5432/scace_ci?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: "scace:"
      BETTER_AUTH_SECRET: ci-only-secret-change-in-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure npm >= 11.5.1 for GitHub OIDC Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify lint, typecheck, tests, and builds
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm --filter @scace/sdk build
          pnpm --filter @scace/sdk test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docs Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false

      - name: Determine release publish command
        id: publish_cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_sdk_publish }}" = "true" ]; then
            echo "command=pnpm release:publish-ci -- --force" >> "$GITHUB_OUTPUT"
          else
            echo "command=pnpm release:publish-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish/Tag Releases
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: ${{ steps.publish_cmd.outputs.command }}
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_PUBLISH_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_sdk }}
          SDK_PUBLISH_AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || vars.SDK_PUBLISH_AUTH_MODE || 'auto' }}
          SDK_PUBLISH_OIDC: ${{ vars.SDK_PUBLISH_OIDC || 'true' }}
          SCACE_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
